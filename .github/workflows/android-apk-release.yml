name: Build AGRIBOT Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.2'
          channel: stable
          cache: true

      - name: Generate Android project
        run: |
          flutter create --platforms=android --org ai.agribot .
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n', '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n' + permission)
              p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release --dart-define=SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AGRIBOT-Android
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Create v1.0.0 release
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/release/v1.0.0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          target_commitish: ${{ github.sha }}
          name: AGRIBOT v1.0.0
          body: |
            First Android release of AGRIBOT.
            Flutter mobile dashboard with Farm/GPS map and live robot location.
          files: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
